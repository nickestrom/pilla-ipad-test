<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilla harness</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.35 -apple-system,system-ui,Segoe UI,sans-serif;color:#231e16;background:#e9e5d9}
  body{display:flex;flex-direction:row}
  #stage{flex:0 0 65%;height:100%;padding:6px}
  #frame{width:100%;height:100%;border:2px solid #231e16;border-radius:10px;background:#f2efe7;display:block}
  #panel{flex:1 1 35%;height:100%;overflow-y:auto;padding:8px 10px 24px;-webkit-overflow-scrolling:touch}
  @media (max-width:760px) and (orientation:portrait){body{flex-direction:column}#stage{flex:0 0 55%;width:100%}#panel{flex:1 1 45%;width:100%}}
  h1{font-size:15px;margin:2px 0 6px} h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#857d6e;margin:14px 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
  .row .lbl{font-weight:700;min-width:84px}
  button{font:inherit;min-height:44px;min-width:44px;padding:6px 14px;border:1.5px solid #231e16;border-radius:10px;background:#fff;color:#231e16;cursor:pointer;touch-action:manipulation}
  button[aria-pressed=true]{background:#231e16;color:#fff}
  button:active{background:#f4b829}
  label.chk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px}
  label.chk input[type=checkbox]{width:22px;height:22px}
  input[type=number]{font:inherit;width:90px;min-height:44px;padding:4px 8px;border:1.5px solid #231e16;border-radius:10px}
  #status{font-size:12px;color:#857d6e;word-break:break-all}
  #log{font:11.5px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1.5px solid #231e16;border-radius:10px;max-height:34vh;overflow-y:auto;padding:4px 8px;margin:0}
  #log div{border-bottom:1px solid #eee;padding:2px 0;word-break:break-all} #log .ack{color:#2a7a3a} #log .bad{color:#b8312a} #log .cmd{color:#37528f} #log .ev{color:#231e16}
</style></head><body>
<div id="stage"><iframe id="frame" sandbox="allow-scripts" title="figure"></iframe></div>
<div id="panel">
  <h1 id="title">Pilla harness</h1>
  <div id="status">loading...</div>
  <h2>Kamera och indata</h2>
  <div class="row" id="toggles"></div>
  <h2>Kontroller</h2><div class="row" id="controls"></div>
  <h2>Delar (highlight)</h2><div class="row" id="parts"></div>
  <div class="row"><label class="chk">ms <input id="hlms" type="number" value="2000" min="0" step="500"></label>
    <button id="hlglow" aria-pressed="true">glow</button><button id="hlpulse" aria-pressed="false">pulse</button></div>
  <h2>Varden (setParam / lockParam)</h2><div id="params"></div>
  <label class="chk"><input id="animate" type="checkbox" checked> animate</label>
  <h2>Tillstand</h2><div id="states"></div>
  <h2>Vyer</h2><div class="row" id="views"></div>
  <h2>Fel</h2><div id="faults"></div>
  <h2>Ovrigt</h2><div class="row"><button id="reset">reset</button></div>
  <h2>Ladda om</h2>
  <div class="row"><label class="chk"><input id="fx0" type="checkbox"> ?fx=0</label><label class="chk"><input id="fps" type="checkbox"> ?fps=1</label><button id="reload">Ladda om</button></div>
  <h2>Handelser (nyast forst)</h2>
  <pre id="log"></pre>
</div>
<script>
(() => {
  // options come from the query string, or from the hash when there is none (hosts that drop query strings, such as a
  // Claude artifact, keep the hash): harness.html#figure=gungbrada&fps=1
  const useHash = !location.search && location.hash.length > 1, raw = () => useHash ? location.hash.slice(1) : location.search;
  const q = new URLSearchParams(raw()), id = q.get('figure') || 'demo', root = q.get('root') || 'figures';
  const base = '../' + root + '/' + id + '/';
  const frame = document.getElementById('frame'), logEl = document.getElementById('log');
  const events = [], pending = new Map(), waiters = [];
  let seq = 0, manifest = null, resolveReady, t0 = performance.now();
  const ready = new Promise(r => { resolveReady = r; });

  const fwd = new URLSearchParams(raw()); fwd.delete('figure'); fwd.delete('root');
  const qs = fwd.toString();

  function log(cls, text){
    const d = document.createElement('div'); d.className = cls;
    d.textContent = ((performance.now() - t0) / 1000).toFixed(2) + 's ' + text; logEl.insertBefore(d, logEl.firstChild);
    while (logEl.childNodes.length > 300) logEl.removeChild(logEl.lastChild);
  }

  function send(type, payload){
    const msg = Object.assign({ v: 2, figure: manifest ? manifest.id : id, seq: ++seq, type }, payload || {});
    const sent = performance.now();
    log('cmd', '> ' + type + ' ' + JSON.stringify(payload || {}));
    return new Promise(resolve => {
      const timer = setTimeout(() => { pending.delete(msg.seq); log('bad', '! no ack for ' + type + ' #' + msg.seq); resolve({ type: 'ack', seq: msg.seq, ok: false, error: 'timeout', ms: performance.now() - sent }); }, 2000);
      pending.set(msg.seq, a => { clearTimeout(timer); a.ms = performance.now() - sent; resolve(a); });
      frame.contentWindow.postMessage(msg, '*');
    });
  }

  function waitFor(type, predicate, timeoutMs, from){
    timeoutMs = timeoutMs == null ? 3000 : timeoutMs; from = from == null ? events.length : from;
    const test = e => e.type === type && (!predicate || predicate(e));
    const hit = events.slice(from).find(test); if (hit) return Promise.resolve(hit);
    return new Promise((resolve, reject) => {
      const w = { test, resolve: e => { clearTimeout(w.timer); resolve(e); } };
      w.timer = setTimeout(() => { waiters.splice(waiters.indexOf(w), 1); reject(new Error('timeout waiting for ' + type)); }, timeoutMs);
      waiters.push(w);
    });
  }

  window.addEventListener('message', ev => {
    const m = ev.data;
    if (ev.source !== frame.contentWindow || !m || m.v !== 2) return;
    if (m.type === 'ack'){
      const fn = pending.get(m.seq); pending.delete(m.seq);
      if (fn) fn(m);
      return;
    }
    m.t = performance.now(); events.push(m);
    const { v, figure, seq: s, t, type, ...rest } = m;
    log('ev', '< ' + type + ' ' + JSON.stringify(rest));
    if (type === 'ready') resolveReady(m);
    for (const w of waiters.slice()) if (w.test(m)){ waiters.splice(waiters.indexOf(w), 1); w.resolve(m); }
  });

  // ack lines in the log show the latency measured by send()
  window.harness = { send: (type, payload) => send(type, payload).then(a => { log(a.ok ? 'ack' : 'bad', '  ack #' + a.seq + ' ' + (a.ok ? 'ok' : 'FAIL ' + a.error) + ' in ' + a.ms.toFixed(1) + ' ms'); return a; }),
    events, waitFor, ready, frame, manifest: null };

  /* ---- panel ---- */
  const $ = i => document.getElementById(i);
  const el = (tag, text, attrs) => { const e = document.createElement(tag); if (text != null) e.textContent = text; Object.assign(e, attrs || {}); return e; };
  const btn = (text, fn, host) => { const b = el('button', text); b.onclick = fn; host.appendChild(b); return b; };
  const label = (host, text) => host.appendChild(el('span', text, { className: 'lbl' }));
  const toggle = (text, cmd, key) => { const b = el('button', text); b.setAttribute('aria-pressed', 'false');
    b.onclick = async () => { const on = b.getAttribute('aria-pressed') !== 'true'; const a = await window.harness.send(cmd, { [key]: on }); if (a.ok) b.setAttribute('aria-pressed', String(on)); };
    $('toggles').appendChild(b); };
  let hlStyle = 'glow';

  function build(m){
    $('title').textContent = m.id + ' (' + m.kind + ')';
    toggle('lockCamera', 'lockCamera', 'on'); toggle('lockInput', 'lockInput', 'on'); toggle('setXray', 'setXray', 'on');
    for (const c of (m.controls || [])) btn('press: ' + ((c.label && c.label.sv) || c.id), () => window.harness.send('press', { control: c.id }), $('controls'));
    for (const p of (m.parts || [])) btn(p.id, () => window.harness.send('highlight', { part: p.id, style: hlStyle, ms: +$('hlms').value || undefined }), $('parts'));
    btn('(clear)', () => window.harness.send('highlight', { part: '' }), $('parts'));
    $('hlglow').onclick = () => { hlStyle = 'glow'; $('hlglow').setAttribute('aria-pressed', 'true'); $('hlpulse').setAttribute('aria-pressed', 'false'); };
    $('hlpulse').onclick = () => { hlStyle = 'pulse'; $('hlpulse').setAttribute('aria-pressed', 'true'); $('hlglow').setAttribute('aria-pressed', 'false'); };
    for (const [name, d] of Object.entries(m.params || {})){
      const row = el('div', null, { className: 'row' }); label(row, name);
      const vals = d.type === 'int' ? Array.from({ length: d.max - d.min + 1 }, (_, i) => d.min + i) : (d.values || []);
      for (const v of vals) btn(String(v), () => window.harness.send('setParam', { param: name, value: v, animate: $('animate').checked }), row);
      let locked = false; const lk = btn('lock', async () => { const a = await window.harness.send('lockParam', { param: name, on: !locked }); if (a.ok){ locked = !locked; lk.setAttribute('aria-pressed', String(locked)); } }, row); lk.setAttribute('aria-pressed', 'false');
      $('params').appendChild(row);
    }
    for (const [key, d] of Object.entries(m.states || {})){
      const row = el('div', null, { className: 'row' }); label(row, key);
      for (const v of d.values) btn(String(v), () => window.harness.send('setState', { key, value: v }), row);
      $('states').appendChild(row);
    }
    for (const v of ['front', 'side', 'back', 'top']) btn(v, () => window.harness.send('rotateTo', { view: v }), $('views'));
    for (const fl of (m.faults || [])){
      const row = el('div', null, { className: 'row' }); label(row, fl.id);
      btn('apply', () => window.harness.send('applyFault', { fault: fl.id }), row); btn('clear', () => window.harness.send('clearFault', { fault: fl.id }), row);
      $('faults').appendChild(row);
    }
    $('reset').onclick = () => window.harness.send('reset', {});
    $('fx0').checked = q.get('fx') === '0'; $('fps').checked = q.get('fps') === '1';
    $('reload').onclick = () => { const n = new URLSearchParams(raw());
      if ($('fx0').checked) n.set('fx', '0'); else n.delete('fx');
      if ($('fps').checked) n.set('fps', '1'); else n.delete('fps');
      if (useHash){ location.hash = n.toString(); location.reload(); } else location.search = n.toString(); };
  }

  fetch(base + 'manifest.json').then(r => { if (!r.ok) throw new Error('manifest ' + r.status); return r.json(); }).then(m => {
    manifest = m; window.harness.manifest = m; build(m);
    $('status').textContent = base + 'figure.html' + (qs ? '?' + qs : '') + ' - waiting for ready...';
    frame.src = base + 'figure.html' + (qs ? '?' + qs : '');
  }).catch(e => { $('status').textContent = 'could not load manifest: ' + e.message; });
  ready.then(r => { $('status').textContent = 'ready. hash ' + String(r.manifestHash).slice(0, 12) + ' parts ' + r.parts.join(',') + ' params ' + r.params.join(',') + ' readings ' + r.readings.join(','); });
})();
</script></body></html>
