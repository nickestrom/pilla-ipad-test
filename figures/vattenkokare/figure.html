    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>
/* ============================================================
   Pilla bridge: the postMessage protocol between a figure (in <iframe sandbox="allow-scripts">, origin "null") and the app.
   build.py inlines this after core.js. It does nothing unless window.MANIFEST is set.

   Envelope (both ways): { v: 2, figure: <manifest id>, seq: <number>, type: <string>, ...payload }
   The figure only handles messages with event.source === window.parent and v === 2; it posts to the parent with "*".

   Commands (app -> figure), each answered at once with { v:2, figure, type:'ack', seq:<the command's seq>, ok, error? }.
   Unknown part/control/param/fault/key, a wrong type or an out-of-range value gives ok:false, never a throw. All idempotent.
     highlight {part, style?, ms?}   setState {key, value}   setParam {param, value, animate?}   lockParam {param, on}
     press {control}   setXray {on}   rotateTo {view}   lockCamera {on}   applyFault {fault}   clearFault {fault, animate?}
     lockInput {on}    reset {}
     clearFault with animate:true (default false) plays the figure's repair animation (1.2-3 s) if the fault has one: the ack
     comes at once, the fault stays active until the animation ends, then 'repaired {fault}' is sent. Without a repair
     animation (or animate false) the fault is cleared at once; with animate:true 'repaired' is still sent, right after the ack.
     A repeated clearFault while a repair runs is an ok no-op; reset cancels the repair (no 'repaired').
     setParam with animate (default true) glides the part along its track (>= 600 ms) when it has one and emits
     paramChanged {by:'app'} when it lands (every time, also when the value did not change, so the app can wait for it).
     rotateTo respects the figure's turning limit (a figure without turn:'full' stays within +-60 degrees of the front).

   Events (figure -> app), each with the figure's own running seq:
     ready {manifestHash, parts, params, readings}  parts = the data-part ids in the drawing now plus those drawn only with
       see-through on (one off-screen render with xr = 1, see ui.partIds); params = the keys of cfg.values; readings = the
       keys of cfg.readings(st).
     tap {part}  control {id}  stateChanged {key, value}  paramChanged {param, value, by}  viewChanged {view}
     fixAttempt {fault, success} (reserved, the engine does not emit it yet)  error {code, message}
     repaired {fault}: a clearFault with animate has played to the end (the fault is cleared now)
     reading {values, settled}: after a render in which the values changed, with settled:false, at most one per 100 ms;
       when the figure has come to rest, exactly one settled:true per rest state (again only after something moved and
       settled again). One settled reading is also sent right after ready.
   Nothing else is logged or sent.
   ============================================================ */
(() => {
  const M = window.MANIFEST;
  if (!M || typeof PILLA_EV === 'undefined') return;
  const FIG = M.id, VIEWS = ['front', 'side', 'back', 'top'];
  let seq = 0, ui = null, cfg = null, ready = false;

  const post = (type, payload) => {
    if (window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ v: 2, figure: FIG, seq: ++seq, type }, payload), '*'); } catch (e) { /* nobody listens */ }
  };
  const has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);
  const ids = list => (list || []).map(x => x.id);
  const isBool = v => typeof v === 'boolean';
  const paramOk = (k, v) => { const d = M.params[k];
    return d.type === 'int' ? Number.isInteger(v) && v >= d.min && v <= d.max : Array.isArray(d.values) && d.values.includes(v); };
  const need = (cond, msg) => cond ? undefined : msg;

  /* ---- commands: return an error string, or nothing for success ---- */
  const CMD = {
    highlight: m => need(typeof m.part === 'string', 'part must be a string')
      || need(!m.part || ids(M.parts).includes(m.part), 'unknown part: ' + m.part)
      || need(m.style == null || m.style === 'glow' || m.style === 'pulse', 'style must be glow or pulse')
      || need(m.ms == null || (typeof m.ms === 'number' && m.ms >= 0), 'ms must be a number >= 0')
      || void ui.highlight(m.part, m.style || 'glow', m.ms),
    setState: m => need(has(M.states, m.key), 'unknown state: ' + m.key)
      || need(M.states[m.key].values.some(v => v === m.value), 'value not allowed for ' + m.key)
      || need(ui.setState(m.key, m.value), 'figure has no handler for state ' + m.key),
    setParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(paramOk(m.param, m.value), 'value out of range for ' + m.param)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.setParam(m.param, m.value, m.animate !== false), 'figure has no handler for param ' + m.param),
    lockParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(isBool(m.on), 'on must be a boolean') || void ui.lockParam(m.param, m.on),
    press: m => need(ids(M.controls).includes(m.control), 'unknown control: ' + m.control)
      || need(cfg.controls && cfg.controls[m.control], 'figure has no handler for control ' + m.control) || void ui.press(m.control),
    setXray: m => need(isBool(m.on), 'on must be a boolean') || void ui.setXray(m.on),
    rotateTo: m => need(VIEWS.includes(m.view), 'unknown view: ' + m.view) || void ui.rotateTo(m.view),
    lockCamera: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockCamera(m.on),
    applyFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(ui.applyFault(m.fault), 'figure has no handler for fault ' + m.fault),
    clearFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.clearFault(m.fault, { animate: m.animate === true }), 'figure has no handler for fault ' + m.fault),
    lockInput: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockInput(m.on),
    reset: () => void ui.reset(),
  };

  addEventListener('message', ev => {
    const m = ev.data;
    if (ev.source !== window.parent || !m || typeof m !== 'object' || m.v !== 2 || typeof m.seq !== 'number' || typeof m.type !== 'string') return;
    if (m.type === 'ack') return;
    let error;
    try {
      if (m.figure !== FIG) error = 'wrong figure';
      else if (!ui) error = 'not ready';
      else if (!has(CMD, m.type)) error = 'unknown command: ' + m.type;
      else error = CMD[m.type](m);
    } catch (e) { error = String((e && e.message) || e); }
    const ack = { v: 2, figure: FIG, type: 'ack', seq: m.seq, ok: !error };
    if (error) ack.error = error;
    try { window.parent.postMessage(ack, '*'); } catch (e) { /* nobody listens */ }
  });

  for (const t of ['tap', 'control', 'stateChanged', 'paramChanged', 'viewChanged', 'fixAttempt', 'repaired']) PILLA_EV.on(t, p => post(t, p));
  addEventListener('error', e => post('error', { code: 'script', message: String(e.message) }));
  addEventListener('unhandledrejection', e => post('error', { code: 'promise', message: String((e.reason && e.reason.message) || e.reason) }));

  /* ---- readings: unsettled while moving (throttled), settled exactly once per rest state ---- */
  let lastJson = '', dirty = false, lastAt = 0, timer = 0;
  const sendReading = settled => { const values = ui.readings(); lastJson = JSON.stringify(values); lastAt = performance.now(); post('reading', { values, settled }); };
  const onRendered = () => {
    if (!ready) return;
    const json = JSON.stringify(ui.readings());
    if (!ui.settled()) {
      dirty = true;
      if (json !== lastJson && !timer) timer = setTimeout(() => { timer = 0; if (!ui.settled() && JSON.stringify(ui.readings()) !== lastJson) sendReading(false); }, Math.max(0, 100 - (performance.now() - lastAt)));
      return;
    }
    clearTimeout(timer); timer = 0;
    if (dirty || json !== lastJson) { dirty = false; sendReading(true); }
  };
  PILLA_EV.on('rendered', onRendered);

  PILLA_EV.on('mounted', e => {
    ui = e.ui; cfg = e.cfg;
    // after the figure script has finished its own setup (xrMount etc.)
    setTimeout(() => {
      post('ready', { manifestHash: window.MANIFEST_HASH || '', parts: ui.partIds(), params: Object.keys(cfg.values || {}), readings: Object.keys(ui.readings()) });
      ready = true; dirty = false; sendReading(true);
    }, 0);
  });
})();

</script>
<script>
/* Pilla - Vattenkokare. A cordless electric kettle standing on its power base on a board next to a power strip.
   Forked from Color Hall's repair-bench job-04 (same engine); the game layer (fee, parts, stars, penalties) is gone.
   How the real kettle works: the base's mains cord feeds a centre 360-degree connector pin; the kettle's floor socket sits on it.
   Live runs through the rocker switch's contacts (in the controller at the bottom of the handle) to a flat sheathed element
   brazed under the stainless floor plate, and back through the boil-dry disc to neutral. When the water boils, steam rises
   into a steam tube whose inlet sits just under the lid on the handle side; the tube runs down the back wall to a bimetal disc
   in the controller. Hot steam snaps the disc (its dish flips), the disc pushes a trip rod and lever that throw the rocker
   off: "click". A second bimetal disc pressed against the floor plate only trips if the kettle boils nearly dry.

   THE LAW (everything on screen follows these numbers; the app reads the same through `readings`):
     temp t in 0..1 (0 = cold tap water 20 C, 1 = boiling 100 C):  C = 20 + 80 t
     powered   = switch on AND connector made AND element whole AND water in the jug
     powered:  t rises 1/HEAT_MS per ms; the element glows.   not powered: t falls 1/COOL_MS per ms.
     t >= 1 and powered: it boils. Steam needs STEAM_MS to run down the tube to the disc; with an open tube the disc then
       snaps in SNAP_MS and the switch clicks off. With a blocked tube (limescale) no steam arrives and it boils on
       (the boil-dry disc ends it only when the water is nearly gone, BOIL_LOSS per second).
     power reading: 'off' (switch off, or no current reaches the kettle), 'heating' (current flows or the switch is on with a
       whole connector but t < 1), 'boiling' (powered and t >= 1).
   Faults (one figure, switched by applyFault / clearFault):
     kalk-i-angror      limescale plugs the steam tube inlet: boils on, never clicks off.
     trasigt-element    the element coil is broken: switch on, lamp glows, the water never heats.
     glapp-i-kontakten  the connector pin does not reach the kettle's contact: nothing happens, no lamp.
   Frame: everything is drawn in bench (world) coordinates. x = depth (the kettle's spout points to +x, its handle to -x),
   y = width, z = up; the board top is z = TZ. The kettle's axis stands at (KX, KY); its base is a disc of radius BR, BH high;
   the jug's skirt bottom is at ZB, the inner floor plate at ZF, the rim at ZT. The body is a tapered round shell swept
   through the rings KR (z, radius); rAt(z) gives its outer radius at any height.
   Parts (manifest ids): vippbrytare (rocker + trip lever + contacts), lampa, element, angror, bimetall, kontakt (pin + socket),
   sockel (base), sladd, lock (lid), pip (spout), vatten (window + water volume), handtag (handle). */
const TZ = 4;                                                   // the board top is at z = TZ
const BNW = 132, BND = 178, BNR = 6;                            // board footprint (x, y)
const BTOP = boardTop(0, 0, BNW, BND, TZ, BNR);
const SK_Y = [140, 158];                                        // the strip's two sockets (y); the cord plugs into the first
const STRIP = { x0:5, x1:17, y0:124, y1:168, h:7.5 };
const STRIP_M = matOf('#e6e2d4');
const LEVM = { l:'#77716b', m:'#46413c', d:'#2a2724' }, KNOBM = { l:'#fff4d6', m:'#e6dcbd', d:'#bfb390' };
const TCOP = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, TGM = { l:'#7c8389', m:'#5c6369', d:'#3b4146' };

/* ---------- the kettle's geometry ---------- */
const KX = 78, KY = 88;                                         // kettle axis on the bench
const BR = 40, BH = 7;                                          // power base: radius, height
const ZB = TZ + BH + .6, ZF = ZB + 5, ZT = ZB + 85;              // jug skirt bottom, inner floor plate, rim
const KR = [[ZB, 30.5], [ZB + 2.6, 33], [ZB + 80, 28.6], [ZB + 85, 26.6]];   // body rings (z, outer radius): chamfer, taper, shoulder
const KM = { l:'#fbf6ea', m:'#e9e1cc', d:'#bcb096' };           // cream body
const BASEM = { l:'#7d8791', m:'#5f6973', d:'#3f474f' };        // slate base
const WATERM = { l:'#bfe3f2', m:'#8fc7e2', d:'#5f9fc4' };
const DEG = Math.PI / 180;
const WIN = { a0: 62*DEG, a1: 78*DEG, z0: ZB + 12, z1: ZB + 76 }; // water window on the side (azimuth range, heights)
const zWater = w => ZF + w * (ZB + 74 - ZF);                     // water level 0..1 -> height (1 = the MAX tick)
const HR = 4.5;                                                  // handle tube radius
const HOUS = { x0: KX - 58, x1: KX - 31.8, y0: KY - 7.5, y1: KY + 7.5, z0: ZB, z1: ZB + 18 };   // controller housing at the handle's foot
const CX = KX - 37.5, DZ = ZB + 10.6, DR = 4.9;                  // thermostat disc: centre (x, on KY), height of its rim, radius
const SPN = norm([.83, 0, .55]);                                 // spout mouth normal

function rAt(z){
  if (z <= KR[0][0]) return KR[0][1];
  for (let i = 1; i < KR.length; i++) if (z <= KR[i][0]){ const [z0, r0] = KR[i-1], [z1, r1] = KR[i]; return r0 + (r1 - r0)*(z - z0)/(z1 - z0); }
  return KR[KR.length - 1][1];
}
const kRing = (z, r, n = 36, cx = KX, cy = KY) => on(PZ(z), ellUV(cx, cy, r, r, n));
const surf = (a, z, dr = .2) => { const r = rAt(z) + dr; return [KX + r*Math.cos(a), KY + r*Math.sin(a), z]; };
const nAt = a => [Math.cos(a), Math.sin(a), 0];
// a patch on the body's surface between two azimuths and two heights (straight sides: the body is a cone between rings)
const patch = (a0, a1, z0, z1, dr = .2, n = 5) => [...Array.from({length:n+1}, (_, i) => surf(a0 + (a1-a0)*i/n, z0, dr)),
  ...Array.from({length:n+1}, (_, i) => surf(a1 - (a1-a0)*i/n, z1, dr))];
const mw = w => `style="stroke-width:${w.toFixed(2)}"`;       // a stroke in model units (not rescaled by inkScale)
const clamp01 = v => Math.max(0, Math.min(1, v));
const boxCorners = (x0, y0, z0, x1, y1, z1) => { const o = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) o.push([x, y, z]); return o; };
const kBoxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - .5), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + .5)];
// text on the round body at azimuth a, reading left to right from outside; hidden when that side turns away
const txA = (a, z, str, size, col = INK, weight = 700, dr = .3) => { const r = rAt(z) + dr, c = Math.cos(a), s = Math.sin(a), o = P(KX + r*c, KY + r*s, z);
  return `<text transform="${txM(o, Dv(s, -c, 0), Dv(0, 0, -1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// a round tube swept along a 3D polyline: in this orthographic view its outline is exactly a stroke 2r wide (r in model units)
function tubeStroke(pts, r, col, inkW = 1.1, hi = null, cap = 'round'){
  const d = pd(pts, false), w = 2*r*CAM_K, a = `fill="none" stroke-linecap="${cap}" stroke-linejoin="round"`;
  let s = `<path d="${d}" ${a} stroke="${INK}" style="stroke-width:${(w + 2*inkW*INK_K).toFixed(2)}"/><path d="${d}" ${a} stroke="${col}" style="stroke-width:${w.toFixed(2)}"/>`;
  if (hi) s += `<path d="${d}" ${a} stroke="${hi}" style="stroke-width:${(.45*w).toFixed(2)}" transform="translate(${(.15*w).toFixed(2)} ${(-.12*w).toFixed(2)})"/>`;
  return s;
}
const bez = (a, c, b, n) => Array.from({length:n+1}, (_, i) => { const t = i/n; return [0,1,2].map(k => (1-t)*(1-t)*a[k] + 2*(1-t)*t*c[k] + t*t*b[k]); });
// invisible tap targets drawn over the see-through insides, so a finger on a thin part is never caught by the water or the shell
const hitLine = (id, pts, r) => part(id, `<path d="${pd(pts, false)}" fill="none" stroke="transparent" style="stroke-width:${(2*r*CAM_K).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" pointer-events="stroke"/>`);
const hitDot = (id, p, r) => { const [X, Y] = P(...p); return part(id, `<circle cx="${f(X)}" cy="${f(Y)}" r="${(r*CAM_K).toFixed(2)}" fill="transparent" pointer-events="all"/>`); };

/* ---------- iPad speed diagnosis (test only; none set = as always) ----------
   ?freeze=1  the drawing clock stands still: the loop still renders every frame, but every layer string is the same as the
              last, so the frame costs only the JavaScript that builds the scene (no DOM write, no repaint)
   ?nosteam=1 no steam wisps (outside and inside)      ?nobub=1 no bubbles (water, window, tube puffs)
   ?hold=1    the simulation stands still (with boil=1: it boils on and never switches itself off) while the drawing clock
              runs, so a measurement sees the same moving scene for as long as it lasts; freeze=1 implies it */
const DIAG = new URLSearchParams(location.search), DIAG_FREEZE = DIAG.get('freeze') === '1',
  DIAG_HOLD = DIAG_FREEZE || DIAG.get('hold') === '1',
  DIAG_NOSTEAM = DIAG.get('nosteam') === '1', DIAG_NOBUB = DIAG.get('nobub') === '1', DIAG_T0 = performance.now();
const drawNow = () => DIAG_FREEZE ? DIAG_T0 : performance.now();

/* ---------- steam: soft white wisps rising and drifting (the toaster's smoke technique, pale) ---------- */
// every animated state value that feeds a colour, an opacity or a size is rounded to steps before it is drawn, so a layer
// that is only fading (the element's glow, the disc, the steam) is rewritten a few dozen times, not on every frame
const qz = (v, n = 16) => Math.round(v*n)/n;
// steam is soft white: two stacked translucent strokes per run of the wisp are enough to read as a soft edge (the engine's
// default of 5 bands makes ~200 overlapping wide translucent paths per frame, which is what a tablet chokes on)
// (3 bands outside, where the steam is the subject; 2 inside, seen through the ghosted shell)
const STEAM_BANDS = 3, STEAM_BANDS_IN = 2;
const steamPaths = (d, strokes, bands) => glowOn() ? bandPaths(d, strokes, '', bands) : softStrokes(d, strokes);
function wisp(base, ph, n, step, sway, dir, alpha, w0 = 3.2, bands = STEAM_BANDS){
  if (DIAG_NOSTEAM) return { pts: [], svg: '' };
  const t = drawNow(), pts = [];
  for (let i = 0; i <= n; i++){
    const sx = Math.sin(t/620 + ph + i*.55)*(.5 + i*.32)*sway, sy = Math.cos(t/760 + ph + i*.42)*(.4 + i*.26)*sway;
    pts.push([base[0] + sx + dir[0]*i, base[1] + sy + dir[1]*i, base[2] + i*step]); }
  const seg = (p0, p1, w, o) => { const d = pd(pts.slice(p0, p1 + 1), false);
    return steamPaths(d, [['#7f8f99', w + 1.8, (.5*o*alpha).toFixed(3)], ['#ffffff', w, (o*alpha).toFixed(3)]], bands); };
  const h = Math.floor(n/2);
  return { pts, svg: seg(0, h, w0, .8) + seg(h - 1, n, w0*.7, .5) };
}
// outside steam: from the spout mouth and around the lid; front = the wisps on the viewer's side of the kettle
function steamOutside(st){
  const a = qz(st.steam), front = [], back = [];
  if (a < .02) return { front:'', back:'' };
  const C0 = SPOUT_C;
  let spw = '';
  // wisp count is the main paint cost on the iPad (measured: each steam wisp is several wide translucent paths that
  // move every frame), so two slightly wider ones from the spout and two thin ones at the lid; the lid ones get 2 bands
  [0, 1].forEach(i => { spw += wisp([C0[0] + .7 + i*.4, C0[1] + (i - .5)*2.4, C0[2] + 1], i*2.6, 8, 4.6, 1.1, [.55, 0], a, 5).svg; });
  (facing([1,0,0]) ? front : back).push(spw);
  [150, 250].forEach((deg, i) => { const an = deg*DEG, r = 26.4, b = [KX + r*Math.cos(an), KY + r*Math.sin(an), ZT + 1.6];
    const ws = wisp(b, 1.3 + i*2.4, 6, 3.8, .9, [.2*Math.cos(an), .2*Math.sin(an)], a*.8, 3.2, STEAM_BANDS_IN).svg;
    (facing(nAt(an)) ? front : back).push(ws); });
  const g = s => s ? softGroup(s) : '';
  return { front: g(front.join('')), back: g(back.join('')) };
}

/* ---------- the closed kettle: base, body, lid, spout, handle ---------- */
const SPOUT_A = Array.from({length:16}, (_, i) => { const t = i/16*2*Math.PI, y = 10*Math.cos(t), z = ZB + 73 + 9*Math.sin(t);
  return [KX + Math.sqrt(rAt(z)**2 - y*y) - .3, KY + y, z]; });                 // root ring, lying on the body
const SPOUT_C = [KX + 40, KY, ZB + 87], SPU = 6.5, SPV = 3.4;                   // mouth centre and half-axes (across, along the lip)
const SPOUT_B = Array.from({length:16}, (_, i) => { const t = i/16*2*Math.PI, c = Math.cos(t), s = Math.sin(t);
  return [SPOUT_C[0] - .55*SPV*s, KY + SPU*c, SPOUT_C[2] + .83*SPV*s]; });       // mouth ring, tilted forward-up
const HANDLE = [[KX - rAt(ZB + 81) + .3, KY, ZB + 81], ...bez([KX - 34, KY, ZB + 81], [KX - 53.5, KY, ZB + 82], [KX - 53.5, KY, ZB + 62], 8),
  [KX - 53.5, KY, ZB + 36], ...bez([KX - 53.5, KY, ZB + 34], [KX - 52, KY, ZB + 30], [KX - 52, KY, ZB + 24], 3).slice(1), [KX - 52, KY, HOUS.z1]];

function baseSvg(st){
  const A0 = kRing(TZ, BR), A1 = kRing(TZ + 5.6, BR), A2 = kRing(TZ + BH, BR - 2.2);
  let s = loft(A0, A1, n => tone(n, BASEM)) + loft(A1, A2, n => tone(n, BASEM)) + fill(pd(A2), tone([0,0,1], BASEM)) + ink(pd(A2), 1.1);

                             { at: [KX - 47, HOUS.y1 + .3, ZB + 13.7], text: partName('lampa'), on: lampLit(st) }] : []),
      ...(facing(nAt(wa)) ? [{ at: surf(wa, ZB + 44, .4), text: partName('vatten'), on: false }] : []),

/* ---------- behaviour (one state object, one clock) ---------- */
let ui, loopOn = false, loopGen = 0, lastPower = 'off';
const jobState = () => ({ on:false, water:.8, temp:0, glow:0, steam:0, boilMs:0, onMs:0, disc:0, warned:false,
  kalk:false, elBroken:false, loose:false });
const HEAT_MS = 6500;                                    // cold to boiling
const COOL_MS = 9000;                                    // boiling to cold when nothing heats
const STEAM_MS = 1500, SNAP_MS = 800;                    // a healthy tube: steam reaches the disc, then the disc snaps over
const NAG_MS = 5000;                                     // a notice if it keeps on boiling (kalk) or on without heat (element)
const BOIL_LOSS = .02;                                   // water boiled away per second while boiling
const DRY_LEVEL = .15;                                   // the boil-dry disc trips below this level
const SIM_SPEED = +new URLSearchParams(location.search).get('speed') || 1;   // testing only: ?speed=4 runs the clock 4x faster
// the law: what the app reads
const tempC = st => Math.round(20 + 80*clamp01(st.temp));
function powerOf(st){
  if (!st.on || st.loose || st.water <= .05) return 'off';
  return !st.elBroken && st.temp >= 1 ? 'boiling' : 'heating';
}
const heats = st => st.on && !st.loose && !st.elBroken && st.water > .05;
function stepSim(st, dt){
  if (heats(st)){
    st.temp = Math.min(1, st.temp + dt / HEAT_MS);
    st.glow = Math.min(1, st.glow + dt / 700);

    st.temp = Math.max(0, st.temp - dt / COOL_MS);
    st.glow = Math.max(0, st.glow - dt / 1500);

    st.steam = Math.min(1, st.steam + dt / 700);

function clickOff(st){
  st.on = false; st.disc = 1;

function dryTrip(st){

// the switch: one press turns it on (or off again). Out-of-order presses answer in simple Swedish.
function startPress(st){

  st.on = true; st.boilMs = 0; st.onMs = 0; st.warned = false;
  if (st.loose) ui.flash('Ingenting händer. Lampan lyser inte heller.', 3200);
  lastPower = powerOf(st);
  PILLA_EV.emit('stateChanged', { key: 'power', value: lastPower });
  runLoop();
}

const clearKalk = st => { st.kalk = false; st.warned = false; runLoop(); };
const clearElement = st => { st.elBroken = false; st.warned = false; runLoop(); };
const clearKontakt = st => { st.loose = false; runLoop(); };
const repairGen = {};
function repairing(kind, total, clear){
  return (st, u, done) => {
    const id = repairGen[kind] = (repairGen[kind] || 0) + 1, t0 = performance.now();

      if (t < total){ st.rep[kind] = t; return true; }

ui = mountFigure({
  turn:'full', size:[BNW, BND, ZT + 8], center:[BNW/2, BND/2], palette:'cobalt',
  // water 0..1 (level), temp 0..1 (1 = boiling), glow 0..1 (element), steam 0..1, disc 0..1 (0 flat, 1 snapped)
  state: jobState(),
  scene,
  readings: st => ({ power: powerOf(st), temp: tempC(st) }),
  states: { power: {
    get: st => powerOf(st),
    set: (st, v, u) => {                      // the app puts the kettle in a state; a fault can still override what is read back
      if (v === 'off') st.on = false;
      else { if (!st.on){ st.on = true; st.boilMs = 0; st.onMs = 0; st.warned = false; }
        if (v === 'boiling'){ st.temp = 1; st.glow = 1; } else if (st.temp >= 1) st.temp = .5; }

  faults: {
    // a fault changes what the sim does from now on, so the loop is (re)started; clearing while the switch is on lets it carry on.
    // repair (clearFault with animate): the drawing follows st.rep[kind] for the given seconds (see "repair animations" above), then
    // the fault is cleared exactly as clear() does and done() is called
    'kalk-i-angror':     { apply: (st) => { st.kalk = true; st.warned = false; runLoop(); },     clear: clearKalk,    repair: repairing('kalk', 2.6, clearKalk) },
    'trasigt-element':   { apply: (st) => { st.elBroken = true; st.warned = false; runLoop(); }, clear: clearElement, repair: repairing('element', 2.4, clearElement) },
    'glapp-i-kontakten': { apply: (st) => { st.loose = true; runLoop(); },                       clear: clearKontakt, repair: repairing('kontakt', 2.0, clearKontakt) },
  },
  controls: { start: (st) => startPress(st) },
  onReset: () => { loopGen++; loopOn = false; lastPower = 'off'; for (const k in repairGen) repairGen[k]++; },
  acts: { switch: (st) => { startPress(st); PILLA_EV.emit('control', { id: 'start' }); } },
  params: (st, q) => {
    for (const k of ['water', 'temp', 'disc']) if (q.has(k)) st[k] = +q.get(k);
    if (q.get('on') === '1') st.on = true;
    if (q.get('boil') === '1') Object.assign(st, { on:true, temp:1, glow:1, steam:1, boilMs:0 });   // boiling and running
    if (st.on && st.temp > 0) st.glow = 1;
  },
});
lastPower = powerOf(ui.st);
if (ui.st.on || ui.st.temp > 0 || ui.st.steam > 0) runLoop();
xrMount(() => ui, () => '');
