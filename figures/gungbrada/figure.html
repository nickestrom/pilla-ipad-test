/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));

  const L = [], R = [];

  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }

        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;

// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){

<script>
/* ============================================================

   Envelope (both ways): { v: 2, figure: <manifest id>, seq: <number>, type: <string>, ...payload }
   The figure only handles messages with event.source === window.parent and v === 2; it posts to the parent with "*".

   Commands (app -> figure), each answered at once with { v:2, figure, type:'ack', seq:<the command's seq>, ok, error? }.
   Unknown part/control/param/fault/key, a wrong type or an out-of-range value gives ok:false, never a throw. All idempotent.
     highlight {part, style?, ms?}   setState {key, value}   setParam {param, value, animate?}   lockParam {param, on}
     press {control}   setXray {on}   rotateTo {view}   lockCamera {on}   applyFault {fault}   clearFault {fault, animate?}
     lockInput {on}    reset {}
     clearFault with animate:true (default false) plays the figure's repair animation (1.2-3 s) if the fault has one: the ack
     comes at once, the fault stays active until the animation ends, then 'repaired {fault}' is sent. Without a repair
     animation (or animate false) the fault is cleared at once; with animate:true 'repaired' is still sent, right after the ack.
     A repeated clearFault while a repair runs is an ok no-op; reset cancels the repair (no 'repaired').
     setParam with animate (default true) glides the part along its track (>= 600 ms) when it has one and emits
     paramChanged {by:'app'} when it lands (every time, also when the value did not change, so the app can wait for it).
     rotateTo respects the figure's turning limit (a figure without turn:'full' stays within +-60 degrees of the front).

   Events (figure -> app), each with the figure's own running seq:
     ready {manifestHash, parts, params, readings}  parts = the data-part ids in the drawing now plus those drawn only with
       see-through on (one off-screen render with xr = 1, see ui.partIds); params = the keys of cfg.values; readings = the
       keys of cfg.readings(st).
     tap {part}  control {id}  stateChanged {key, value}  paramChanged {param, value, by}  viewChanged {view}
     fixAttempt {fault, success} (reserved, the engine does not emit it yet)  error {code, message}
     repaired {fault}: a clearFault with animate has played to the end (the fault is cleared now)
     reading {values, settled}: after a render in which the values changed, with settled:false, at most one per 100 ms;
       when the figure has come to rest, exactly one settled:true per rest state (again only after something moved and
       settled again). One settled reading is also sent right after ready.
   Nothing else is logged or sent.
   ============================================================ */
(() => {
  const M = window.MANIFEST;
  if (!M || typeof PILLA_EV === 'undefined') return;
  const FIG = M.id, VIEWS = ['front', 'side', 'back', 'top'];
  let seq = 0, ui = null, cfg = null, ready = false;

  const post = (type, payload) => {
    if (window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ v: 2, figure: FIG, seq: ++seq, type }, payload), '*'); } catch (e) { /* nobody listens */ }
  };
  const has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);
  const ids = list => (list || []).map(x => x.id);
  const isBool = v => typeof v === 'boolean';
  const paramOk = (k, v) => { const d = M.params[k];
    return d.type === 'int' ? Number.isInteger(v) && v >= d.min && v <= d.max : Array.isArray(d.values) && d.values.includes(v); };
  const need = (cond, msg) => cond ? undefined : msg;

  /* ---- commands: return an error string, or nothing for success ---- */
  const CMD = {
    highlight: m => need(typeof m.part === 'string', 'part must be a string')
      || need(!m.part || ids(M.parts).includes(m.part), 'unknown part: ' + m.part)
      || need(m.style == null || m.style === 'glow' || m.style === 'pulse', 'style must be glow or pulse')
      || need(m.ms == null || (typeof m.ms === 'number' && m.ms >= 0), 'ms must be a number >= 0')
      || void ui.highlight(m.part, m.style || 'glow', m.ms),
    setState: m => need(has(M.states, m.key), 'unknown state: ' + m.key)
      || need(M.states[m.key].values.some(v => v === m.value), 'value not allowed for ' + m.key)
      || need(ui.setState(m.key, m.value), 'figure has no handler for state ' + m.key),
    setParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(paramOk(m.param, m.value), 'value out of range for ' + m.param)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.setParam(m.param, m.value, m.animate !== false), 'figure has no handler for param ' + m.param),
    lockParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(isBool(m.on), 'on must be a boolean') || void ui.lockParam(m.param, m.on),
    press: m => need(ids(M.controls).includes(m.control), 'unknown control: ' + m.control)
      || need(cfg.controls && cfg.controls[m.control], 'figure has no handler for control ' + m.control) || void ui.press(m.control),
    setXray: m => need(isBool(m.on), 'on must be a boolean') || void ui.setXray(m.on),
    rotateTo: m => need(VIEWS.includes(m.view), 'unknown view: ' + m.view) || void ui.rotateTo(m.view),
    lockCamera: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockCamera(m.on),
    applyFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(ui.applyFault(m.fault), 'figure has no handler for fault ' + m.fault),
    clearFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.clearFault(m.fault, { animate: m.animate === true }), 'figure has no handler for fault ' + m.fault),
    lockInput: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockInput(m.on),
    reset: () => void ui.reset(),
  };

  addEventListener('message', ev => {
    const m = ev.data;
    if (ev.source !== window.parent || !m || typeof m !== 'object' || m.v !== 2 || typeof m.seq !== 'number' || typeof m.type !== 'string') return;
    if (m.type === 'ack') return;
    let error;
    try {
      if (m.figure !== FIG) error = 'wrong figure';
      else if (!ui) error = 'not ready';
      else if (!has(CMD, m.type)) error = 'unknown command: ' + m.type;
      else error = CMD[m.type](m);
    } catch (e) { error = String((e && e.message) || e); }
    const ack = { v: 2, figure: FIG, type: 'ack', seq: m.seq, ok: !error };
    if (error) ack.error = error;
    try { window.parent.postMessage(ack, '*'); } catch (e) { /* nobody listens */ }
  });

  for (const t of ['tap', 'control', 'stateChanged', 'paramChanged', 'viewChanged', 'fixAttempt', 'repaired']) PILLA_EV.on(t, p => post(t, p));
  addEventListener('error', e => post('error', { code: 'script', message: String(e.message) }));
  addEventListener('unhandledrejection', e => post('error', { code: 'promise', message: String((e.reason && e.reason.message) || e.reason) }));

  /* ---- readings: unsettled while moving (throttled), settled exactly once per rest state ---- */
  let lastJson = '', dirty = false, lastAt = 0, timer = 0;
  const sendReading = settled => { const values = ui.readings(); lastJson = JSON.stringify(values); lastAt = performance.now(); post('reading', { values, settled }); };
  const onRendered = () => {
    if (!ready) return;
    const json = JSON.stringify(ui.readings());
    if (!ui.settled()) {
      dirty = true;
      if (json !== lastJson && !timer) timer = setTimeout(() => { timer = 0; if (!ui.settled() && JSON.stringify(ui.readings()) !== lastJson) sendReading(false); }, Math.max(0, 100 - (performance.now() - lastAt)));
      return;
    }
    clearTimeout(timer); timer = 0;
    if (dirty || json !== lastJson) { dirty = false; sendReading(true); }
  };
  PILLA_EV.on('rendered', onRendered);

  PILLA_EV.on('mounted', e => {
    ui = e.ui; cfg = e.cfg;
    // after the figure script has finished its own setup (xrMount etc.)
    setTimeout(() => {
      post('ready', { manifestHash: window.MANIFEST_HASH || '', parts: ui.partIds(), params: Object.keys(cfg.values || {}), readings: Object.keys(ui.readings()) });
      ready = true; dirty = false; sendReading(true);
    }, 0);
  });
})();

</script>
<script>
/* Gungbrada (seesaw): the lever. Weight times distance from the pivot decides which side goes down.

   LAW (same as concepts/havstang.law.js; the reading AND the plank's target angle are computed from it, never from
   where things are drawn):
     left  = m1 * d1      side 1 = the stone stack, on the viewer's LEFT at the home view, i.e. the +y end
     right = m2 * d2      side 2 = the block stack, on the viewer's RIGHT, i.e. the -y end
   Home view: side-on (yaw 0, looking along -x, so +y is screen-left) and low (pitch 22), so the plank runs across the
   screen and a child sees at once which end goes down. From the classic yaw-45 view the plank runs into the picture and
   "left down" and "right down" look almost alike.
     tilt  = left > right ? 'vanster-ner' : left < right ? 'hoger-ner' : 'rak'
   Target angle: 0 when 'rak', else a fixed TILT degrees toward the heavier side (until the low end rests on its rubber
   stop). The plank eases there over >= 0.9 s, starting when a dragged load lands (values.set -> retilt).

   Model: x = depth (plank 18 wide), y = along the plank (the plank runs along y, centre YC), z = up. Board 64 x 220.
   Parts: planka (plank + 4 notches per side + hanger bracket), bock (two A-frame end panels with bolts, the pivot),
   sten (1-4 grey blocks, drag along the left notches), kloss (1-4 orange blocks, drag along the right notches).
   Not parts: grass board, two rubber stops under the plank ends. Plank angle ang: degrees, positive = left (+y) end down.
   Drawing order: board, shadow, then byDepth of [stops, two frames, plank group] (frames are separated from the plank
   along x, stops lie below it); inside the plank group the plank comes first and the two stacks (separated along y) after.
   Loads stay upright and sit on the plank surface at the notch. */
const LAW = (m1, d1, m2, d2) => {
  const left = m1 * d1, right = m2 * d2;
  return { tilt: left > right ? 'vanster-ner' : left < right ? 'hoger-ner' : 'rak' };
};
const TILT = 13;                                                     // degrees, toward the heavier side
const tiltTarget = st => { const t = LAW(st.sv, st.sp, st.kv, st.kp).tilt; return t === 'vanster-ner' ? TILT : t === 'hoger-ner' ? -TILT : 0; };

const GW = 64, GD = 220, GH = 100, BH = 3;                           // board footprint, figure height, board thickness
const CX = 32, YC = 110;                                             // pivot axis position (x centre, y centre)
const HALF = 95, STEP = 20, PV0 = 3, PV1 = 8, PHW = 9;               // plank half length, notch spacing, plank v range, half width
const BLK = 12, BLH = 11;                                            // one load block: 12 x 12 wide, 11 high
const RAD = Math.PI / 180;
const ZP = BH + 2.5 + HALF * Math.sin(TILT * RAD) - PV0 * Math.cos(TILT * RAD);   // axle height: the low end then rests on a 2.5 high stop
const ZT = ZP + 4.5;                                                 // top of the frames
const LEGX = 34;                                                     // leg foot offset from the centre in y
const GRASS = { l: '#a8d77f', m: '#8cc063', d: '#659447' };
const STONE = { l: '#cfd3d6', m: '#a3a9ae', d: '#6d737a' };
const KLOSS = { l: '#f4936f', m: '#dd6542', d: '#a03c23' };
const FRM = { l: '#8fb9e3', m: '#5b8fc7', d: '#3a5f8a' };
const RUBBER = matOf('#4b4641');

// a point on the plank: x offset, u along the plank (+ = left end), v above the axle line, plank angle a (degrees)
const w3 = (xo, u, v, a) => { const r = a * RAD, s = Math.sin(r), c = Math.cos(r); return [CX + xo, YC + u * c + v * s, ZP - u * s + v * c]; };
const yz = (u, v, a) => w3(0, u, v, a).slice(1);

// a box in the plank's own frame (x0..x1 offsets, u0..u1, v0..v1), tilted by a; returns its svg
function tiltedBox(x0, x1, u0, u1, v0, v1, a, m, w){
  const r = a * RAD, sn = Math.sin(r), cs = Math.cos(r), X0 = CX + x0, X1 = CX + x1;
  const A = yz(u0, v0, a), B = yz(u1, v0, a), C = yz(u1, v1, a), E = yz(u0, v1, a);
  const p3 = (X, q) => [X, q[0], q[1]];
  const faces = [
    [[0, sn, cs], [p3(X0, C), p3(X1, C), p3(X1, E), p3(X0, E)]],
    [[0, -sn, -cs], [p3(X0, A), p3(X1, A), p3(X1, B), p3(X0, B)]],
    [[0, cs, -sn], [p3(X0, B), p3(X1, B), p3(X1, C), p3(X0, C)]],
    [[0, -cs, sn], [p3(X0, A), p3(X1, A), p3(X1, E), p3(X0, E)]],
    [[1, 0, 0], [p3(X1, A), p3(X1, B), p3(X1, C), p3(X1, E)]],
    [[-1, 0, 0], [p3(X0, A), p3(X0, B), p3(X0, C), p3(X0, E)]] ];
  const corners = []; for (const X of [X0, X1]) for (const q of [A, B, C, E]) corners.push(p3(X, q));
  return { svg: faces.filter(([n]) => vis(n)).map(([n, q]) => shape(q, tone(n, m), w)).join('') + hullInk(corners, 2.4), corners };
}

const bounds = pts => [[0, 1, 2].map(k => Math.min(...pts.map(p => p[k]))), [0, 1, 2].map(k => Math.max(...pts.map(p => p[k])))];

/* ---------- the plank ---------- */
function plankSvg(st){
  const a = st.ang, pl = tiltedBox(-PHW, PHW, -HALF, HALF, PV0, PV1, a, WOOD, 1.6);
  let s = tiltedBox(-PHW, PHW, -6, 6, -2.8, PV0, a, METAL, 1.2).svg + pl.svg;
  const r = a * RAD;
  if (vis([0, Math.sin(r), Math.cos(r)]))
    for (const side of [1, -1]) for (let i = 1; i <= 4; i++){
      const u = side * STEP * i, ring = n => Array.from({ length: 18 }, (_, k) => { const t = k / 18 * 2 * Math.PI; return w3(n * Math.cos(t), u + n * Math.sin(t), PV1 + .06, a); });
      s += shape(ring(5.6), '#f3dcae', 0) + shape(ring(4.2), '#5e3b1d', 1);
    }
  return { svg: s, corners: pl.corners };
}

/* ---------- the loads: a stack of n equal blocks standing upright on the plank at base point p ---------- */
function stackBox(n, p){ return [[p[0] - BLK / 2, p[1] - BLK / 2, p[2] - 1.6], [p[0] + BLK / 2, p[1] + BLK / 2, p[2] + n * BLH]]; }
function stackSvg(n, p, m){
  let s = ''; const pts = [];
  for (let k = 0; k < n; k++){
    const z0 = p[2] + k * BLH, z1 = z0 + BLH;
    s += box(p[0] - BLK / 2, p[1] - BLK / 2, z0, p[0] + BLK / 2, p[1] + BLK / 2, z1, m, toneI, 1.2);
    for (const x of [-BLK / 2, BLK / 2]) for (const y of [-BLK / 2, BLK / 2]) for (const z of [z0, z1]) pts.push([p[0] + x, p[1] + y, z]);
  }
  return s + hullInk(pts, 2.2);
}
// the invisible hit shapes of a drag(), repeated as the last thing drawn so no nearer part can cover the stack
function hitTop(id, track, n){
  const base = trackPoint(track), el = document.getElementById('fig'), mt = el && el.getScreenCTM(), k = mt ? Math.hypot(mt.a, mt.b) || 1 : 1;
  const [x, y] = P(...base), pts = [], b = stackBox(n, base);
  for (const X of [b[0][0], b[1][0]]) for (const Y of [b[0][1], b[1][1]]) for (const Z of [b[0][2], b[1][2]]) pts.push(P(X, Y, Z));
  return `<g data-part="${id}" data-drag="${track.param}"><polygon data-hit="1" points="${hull(pts).map(q => f(q[0]) + ',' + f(q[1])).join(' ')}" fill="transparent" pointer-events="all"/>`
    + `<circle data-hit="1" cx="${f(x)}" cy="${f(y)}" r="${f(32 / k)}" fill="transparent" pointer-events="all"/></g>`;
}

/* ---------- the bock: two A-frame end panels, one each side of the plank, with the pivot bolt ---------- */
function prismYZ(quad, xa, xb, m){
  let s = loft(on(PX(xa), quad), on(PX(xb), quad), n => tone(n, m));
  for (const [x, n] of [[xb, [1, 0, 0]], [xa, [-1, 0, 0]]]) if (vis(n)) s += fill(pd(on(PX(x), quad)), tone(n, m)) + ink(pd(on(PX(x), quad)), 1.2);
  return s + hullInk([...on(PX(xa), quad), ...on(PX(xb), quad)], 2);
}
const FOOT = LEGX + 6, TOPW = 8;                                     // end panel: trapezoid, half width at the foot and at the top
const frameX = sx => sx > 0 ? [CX + 10, CX + 14] : [CX - 14, CX - 10];
function frameSvg(sx){
  const [xa, xb] = frameX(sx), quad = [[YC - TOPW, ZT], [YC + TOPW, ZT], [YC + FOOT, BH], [YC - FOOT, BH]];
  const inset = [[YC - TOPW + 3.2, ZT - 3.2], [YC + TOPW - 3.2, ZT - 3.2], [YC + FOOT - 5.5, BH + 3.2], [YC - FOOT + 5.5, BH + 3.2]];
  let s = prismYZ(quad, xa, xb, FRM);
  for (const [x, n, o] of [[xb, [1, 0, 0], .05], [xa, [-1, 0, 0], -.05]]) if (vis(n)) s += shape(on(PX(x + o), inset), mix(tone(n, FRM), '#ffffff', .22), 1);
  const out = sx > 0 ? [xb, xb + 1.6] : [xa - 1.6, xa];
  return s + cylX(out[0], out[1], YC, ZP, 5.5, METAL, toneI, 1.2, 20) + cylX(sx > 0 ? out[1] : out[0] - 1.4, sx > 0 ? out[1] + 1.4 : out[0], YC, ZP, 2.4, matOf('#8a9094'), toneI, 1);
}
const frameBox = sx => { const [xa, xb] = frameX(sx); return [[sx > 0 ? xa : xa - 3, YC - FOOT, BH], [sx > 0 ? xb + 3 : xb, YC + FOOT, ZT]]; };
const frameCorners = sx => frameX(sx).flatMap(x => [[x, YC - TOPW, ZT], [x, YC + TOPW, ZT], [x, YC + FOOT, BH], [x, YC - FOOT, BH]]);

function grassTufts(){
  let s = '';
  for (const [x, y] of [[8, 22], [52, 40], [10, 70], [55, 88], [7, 150], [54, 168], [12, 198], [50, 205], [56, 128], [6, 112]]){
    s += line([[x - 1.6, y - 1.2, BH + .05], [x, y, BH + 3.4], [x + .2, y + 1.6, BH + .05]], 1) + line([[x + 1.4, y + 1.2, BH + .05], [x + 2.4, y + 2.6, BH + 3]], 1);
  }
  return `<g opacity=".55">${s}</g>`;
}

/* ---------- scene ---------- */
function scene(st, m){
  const a = st.ang, top = boardTop(0, 0, GW, GD, BH, 8);
  const stoneTrack = { param: 'sten-pos', stops: [1, 2, 3, 4].map(i => w3(0, STEP * i, PV1, a)) };
  const klossTrack = { param: 'kloss-pos', stops: [1, 2, 3, 4].map(i => w3(0, -STEP * i, PV1, a)) };
  const stoneP = trackPoint(stoneTrack), klossP = trackPoint(klossTrack);
  const sBox = stackBox(st.sv, stoneP), kBox = stackBox(st.kv, klossP);
  const pl = plankSvg(st), plBox = bounds([...pl.corners, ...sBox, ...kBox]);

  let s = board(0, 0, GW, GD, BH, 8, GRASS) + grassTufts();
  s += castShadow([...frameCorners(1), ...frameCorners(-1)], BH, top) + castShadow(pl.corners, BH, top);
  for (const b of [sBox, kBox]) s += castShadow([0, 1].flatMap(i => [0, 1].flatMap(j => [b[0][2], b[1][2]].map(z => [b[i][0], b[j][1], z]))), BH, top);

  const stops = [1, -1].map(sy => ({ box: [[CX - 7.5, YC + sy * 88 - 7.5, BH], [CX + 7.5, YC + sy * 88 + 7.5, BH + 2.4]], svg: cyl(CX, YC + sy * 88, BH, BH + 2.4, 7.5, RUBBER, toneI, 1.2) }));
  const group = part('planka', pl.svg) + byDepth([
    { box: sBox, svg: drag('sten', stackSvg(st.sv, stoneP, STONE), stoneTrack) },
    { box: kBox, svg: drag('kloss', stackSvg(st.kv, klossP, KLOSS), klossTrack) } ]);
  s += byDepth([
    ...stops,
    { box: frameBox(1), svg: part('bock', frameSvg(1)) },
    { box: frameBox(-1), svg: part('bock', frameSvg(-1)) },
    { box: plBox, svg: group } ]);
  s += hitTop('sten', stoneTrack, st.sv) + hitTop('kloss', klossTrack, st.kv);

  const sx = CAM_V[0] >= 0 ? 1 : -1, moving = Math.abs(st.ang - tiltTarget(st)) > .05;
  s += xrCallouts([
    { at: w3(0, 50, PV1, a), text: partName('planka'), on: moving },
    { at: [CX + sx * 13, YC, BH + 10], text: partName('bock'), on: false },
    { at: [stoneP[0], stoneP[1], stoneP[2] + st.sv * BLH], text: partName('sten'), on: false },
    { at: [klossP[0], klossP[1], klossP[2] + st.kv * BLH], text: partName('kloss'), on: false } ], [0, GW, 0, GD, 0, GH]);
  return s;
}

/* ---------- behaviour: the plank eases to the angle the law gives ---------- */
let tiltId = 0;
function retilt(st, ui){
  const from = st.ang, to = tiltTarget(st), id = ++tiltId, dur = 0.9 + 0.5 * Math.abs(to - from) / (2 * TILT);   // 0.9 s .. 1.4 s
  let t = 0;
  ui.animate(dt => { if (id !== tiltId) return false; t += dt; const k = Math.min(1, t / dur); st.ang = from + (to - from) * ease(k);
    if (k < 1) return true; st.ang = to; return false; });
}
const own = key => ({ get: st => st[key], set: (st, v, ui) => { st[key] = v; retilt(st, ui); } });

const start = { sp: 1, sv: 3, kp: 1, kv: 1, ang: 0 };
start.ang = tiltTarget(start);
const ui = mountFigure({
  turn: 'full', home: [0, 22], size: [GW, GD, GH], palette: 'mint',
  state: start,
  scene,
  readings: st => ({ lutning: LAW(st.sv, st.sp, st.kv, st.kp).tilt }),
  values: { 'sten-pos': own('sp'), 'sten-vikt': own('sv'), 'kloss-pos': own('kp'), 'kloss-vikt': own('kv') },
  onReset: () => { tiltId++; },
  params: (st, q) => {                                                // screenshot states: ?sp=2&sv=2&kp=3&kv=1  (ang follows the law unless ?ang= is given)
    for (const k of ['sp', 'sv', 'kp', 'kv']) if (q.has(k)) st[k] = Math.max(1, Math.min(4, +q.get(k) | 0));
    st.ang = q.has('ang') ? +q.get('ang') : tiltTarget(st);
  },
});
xrMount(() => ui, () => '', { labelsOnly: true });
</script><style>@media (max-width:560px),(pointer:coarse){#art{filter:none!important}.ctl:has(#wb){display:none!important}}</style><style>@media (max-width:560px){html body .kpad{width:100%;box-sizing:border-box;justify-content:space-between;gap:10px;margin:10px 0 0;padding:0;border:0;background:none;box-shadow:none}
html body .kpad .dp{display:flex;gap:8px}html body .kpad .hub{display:none}
