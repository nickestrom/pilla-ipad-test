<script>
/* ============================================================
   Pilla bridge: the postMessage protocol between a figure (in <iframe sandbox="allow-scripts">, origin "null") and the app.
   build.py inlines this after core.js. It does nothing unless window.MANIFEST is set.

   Envelope (both ways): { v: 2, figure: <manifest id>, seq: <number>, type: <string>, ...payload }
   The figure only handles messages with event.source === window.parent and v === 2; it posts to the parent with "*".

   Commands (app -> figure), each answered at once with { v:2, figure, type:'ack', seq:<the command's seq>, ok, error? }.
   Unknown part/control/param/fault/key, a wrong type or an out-of-range value gives ok:false, never a throw. All idempotent.
     highlight {part, style?, ms?}   setState {key, value}   setParam {param, value, animate?}   lockParam {param, on}
     press {control}   setXray {on}   rotateTo {view}   lockCamera {on}   applyFault {fault}   clearFault {fault, animate?}
     lockInput {on}    reset {}
     clearFault with animate:true (default false) plays the figure's repair animation (1.2-3 s) if the fault has one: the ack
     comes at once, the fault stays active until the animation ends, then 'repaired {fault}' is sent. Without a repair
     animation (or animate false) the fault is cleared at once; with animate:true 'repaired' is still sent, right after the ack.
     A repeated clearFault while a repair runs is an ok no-op; reset cancels the repair (no 'repaired').
     setParam with animate (default true) glides the part along its track (>= 600 ms) when it has one and emits
     paramChanged {by:'app'} when it lands (every time, also when the value did not change, so the app can wait for it).
     rotateTo respects the figure's turning limit (a figure without turn:'full' stays within +-60 degrees of the front).

   Events (figure -> app), each with the figure's own running seq:
     ready {manifestHash, parts, params, readings}  parts = the data-part ids in the drawing now plus those drawn only with
       see-through on (one off-screen render with xr = 1, see ui.partIds); params = the keys of cfg.values; readings = the
       keys of cfg.readings(st).
     tap {part}  control {id}  stateChanged {key, value}  paramChanged {param, value, by}  viewChanged {view}
     fixAttempt {fault, success} (reserved, the engine does not emit it yet)  error {code, message}
     repaired {fault}: a clearFault with animate has played to the end (the fault is cleared now)
     reading {values, settled}: after a render in which the values changed, with settled:false, at most one per 100 ms;
       when the figure has come to rest, exactly one settled:true per rest state (again only after something moved and
       settled again). One settled reading is also sent right after ready.

  };

  const CMD = {
    highlight: m => need(typeof m.part === 'string', 'part must be a string')
      || need(!m.part || ids(M.parts).includes(m.part), 'unknown part: ' + m.part)
      || need(m.style == null || m.style === 'glow' || m.style === 'pulse', 'style must be glow or pulse')
      || need(m.ms == null || (typeof m.ms === 'number' && m.ms >= 0), 'ms must be a number >= 0')
      || void ui.highlight(m.part, m.style || 'glow', m.ms),
    setState: m => need(has(M.states, m.key), 'unknown state: ' + m.key)
      || need(M.states[m.key].values.some(v => v === m.value), 'value not allowed for ' + m.key)
      || need(ui.setState(m.key, m.value), 'figure has no handler for state ' + m.key),
    setParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(paramOk(m.param, m.value), 'value out of range for ' + m.param)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.setParam(m.param, m.value, m.animate !== false), 'figure has no handler for param ' + m.param),
    lockParam: m => need(has(M.params, m.param), 'unknown param: ' + m.param)
      || need(isBool(m.on), 'on must be a boolean') || void ui.lockParam(m.param, m.on),
    press: m => need(ids(M.controls).includes(m.control), 'unknown control: ' + m.control)
      || need(cfg.controls && cfg.controls[m.control], 'figure has no handler for control ' + m.control) || void ui.press(m.control),
    setXray: m => need(isBool(m.on), 'on must be a boolean') || void ui.setXray(m.on),
    rotateTo: m => need(VIEWS.includes(m.view), 'unknown view: ' + m.view) || void ui.rotateTo(m.view),
    lockCamera: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockCamera(m.on),
    applyFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(ui.applyFault(m.fault), 'figure has no handler for fault ' + m.fault),
    clearFault: m => need(ids(M.faults).includes(m.fault), 'unknown fault: ' + m.fault)
      || need(m.animate == null || isBool(m.animate), 'animate must be a boolean')
      || need(ui.clearFault(m.fault, { animate: m.animate === true }), 'figure has no handler for fault ' + m.fault),
    lockInput: m => need(isBool(m.on), 'on must be a boolean') || void ui.lockInput(m.on),
    reset: () => void ui.reset(),
  };

  addEventListener('message', ev => {
    const m = ev.data;
    if (ev.source !== window.parent || !m || typeof m !== 'object' || m.v !== 2 || typeof m.seq !== 'number' || typeof m.type !== 'string') return;
    if (m.type === 'ack') return;
    let error;
    try {
      if (m.figure !== FIG) error = 'wrong figure';
      else if (!ui) error = 'not ready';
      else if (!has(CMD, m.type)) error = 'unknown command: ' + m.type;
      else error = CMD[m.type](m);
    } catch (e) { error = String((e && e.message) || e); }
    const ack = { v: 2, figure: FIG, type: 'ack', seq: m.seq, ok: !error };
    if (error) ack.error = error;
    try { window.parent.postMessage(ack, '*'); } catch (e) { /* nobody listens */ }
  });

  for (const t of ['tap', 'control', 'stateChanged', 'paramChanged', 'viewChanged', 'fixAttempt', 'repaired']) PILLA_EV.on(t, p => post(t, p));
  addEventListener('error', e => post('error', { code: 'script', message: String(e.message) }));
  addEventListener('unhandledrejection', e => post('error', { code: 'promise', message: String((e.reason && e.reason.message) || e.reason) }));

  /* ---- readings: unsettled while moving (throttled), settled exactly once per rest state ---- */
  let lastJson = '', dirty = false, lastAt = 0, timer = 0;
  const sendReading = settled => { const values = ui.readings(); lastJson = JSON.stringify(values); lastAt = performance.now(); post('reading', { values, settled }); };
  const onRendered = () => {
    if (!ready) return;
    const json = JSON.stringify(ui.readings());
    if (!ui.settled()) {
      dirty = true;
      if (json !== lastJson && !timer) timer = setTimeout(() => { timer = 0; if (!ui.settled() && JSON.stringify(ui.readings()) !== lastJson) sendReading(false); }, Math.max(0, 100 - (performance.now() - lastAt)));
      return;
    }
    clearTimeout(timer); timer = 0;
    if (dirty || json !== lastJson) { dirty = false; sendReading(true); }
  };
  PILLA_EV.on('rendered', onRendered);

  PILLA_EV.on('mounted', e => {
    ui = e.ui; cfg = e.cfg;
    // after the figure script has finished its own setup (xrMount etc.)
    setTimeout(() => {
      post('ready', { manifestHash: window.MANIFEST_HASH || '', parts: ui.partIds(), params: Object.keys(cfg.values || {}), readings: Object.keys(ui.readings()) });
      ready = true; dirty = false; sendReading(true);
    }, 0);
  });
})();

</script>
<script>
/* Pilla - Brodrost. A pop-up toaster on a board next to a power strip.
   Forked from Color Hall's repair-bench jobs 01-03 (same engine, same toaster); the three faults are merged into one figure
   and the game layer (fee, parts cost, scoring, penalties, job ticket, spare-parts box) is gone.
   How the real toaster works: push the lever down -> the carriage (with the bread racks) rides down a guide rod and is
   caught by a latch, which also closes the switch contacts -> mains reaches the heating cards (mica plates wound with
   nichrome wire) and they glow -> a bimetal strip (copper + steel) sits by the outer card; copper grows more when warm, so the
   strip bends toward the latch -> when it has bent far enough it pushes the latch off the carriage -> the extension spring
   hauls the carriage up, the toast pops, and the contacts open.

   THE LAW (everything on screen follows these numbers; the app reads the same through `readings`):
     phase: 'up' (lever up, bread pale), 'toasting' (carriage down), 'popped' (carriage has come up after toasting)
     each of the 4 bread faces has a brownness b in 0..BMAX; b rises BRATE per ms times heat while the cards are on
     rostning = round(100 * mean(b) / BMAX)
     the strip bends 1/BEND_MS per ms once the cards have been on WARM ms; at bend = 1 the latch lets go (RELEASE_MS),
     the contacts open at half way, the spring (if whole) lifts the carriage in POP_MS.
   Faces: 0 = slice A back (back outer card), 1 = slice A front (middle card), 2 = slice B back (middle card), 3 = slice B front (front outer
     card, the one that breaks).
   Faults (one figure, switched by applyFault / clearFault / repair):
     trasig-fjader      the spring is snapped: the latch lets go, the toast toasts, the carriage stays down.
     trasig-glodtrad    one wire row of the front outer card (slice B's front face) is broken: the card stays grey, that face stays pale.
     sprucken-bimetall  the strip has cracked: it never bends, never pushes the latch: the cards keep on, the toast keeps browning.
   Frame: the toaster is drawn in its own frame (x = depth, front at x = W; y = width; z = height) inside a translated group
   and placed on the bench at (TX, TY, TZ); the props use bench (world) coordinates.
   Parts (manifest ids): spak, slits, brod, vagn, fjader, glodtrad, varmekort, bimetall, sparr, ratt, sladd, smulbricka. */
const W = 70, D = 120, H = 80;
const OUT = rrUV(0, 0, D, H, 12);                              // body profile in (y, z), swept along x
const SHADES = [
  { name:'light',  col:'#dcae62' },
  { name:'golden', col:'#bf7f37' },
  { name:'dark',   col:'#7d4a22' },
];
const RAW = '#f2dfab', BURNT = '#4a2a14';
const SLOTS = [18, 42];
const DY = D - 100, DZ = H - 61, DR = 5;                       // shade dial centre (y, z) and radius
const CREAM = '#fff4d6', RECESS = '#2b2523';
const LEVM = { l:'#77716b', m:'#46413c', d:'#2a2724' }, KNOBM = { l:'#fff4d6', m:'#e6dcbd', d:'#bfb390' };

/* ---------- the bench ---------- */
const TX = 46, TY = 30, TZ = 4;                                // toaster origin on the bench; the board top is at z = TZ
const BNW = 134, BND = 178, BNR = 6;                           // board footprint (x, y)
const BTOP = boardTop(0, 0, BNW, BND, TZ, BNR);
const wp = (x, y, z) => [x + TX, y + TY, z + TZ];              // toaster frame -> bench frame
const SK_Y = [140, 158];                                       // the strip's two sockets (y); the cord plugs into the first
const STRIP = { x0:5, x1:17, y0:124, y1:168, h:7.5 };
const STRIP_M = matOf('#e6e2d4');
const TCOP = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' };

/* ---------- the front panel: a local (u right, v down) frame on the plane x = W + dx ---------- */
const FL = (u, v, dx = .3) => [W + dx, D - u, H - v];
const txB = (x,y,z,str,size,col=INK,weight=700) => `<text transform="${txM(P(x,y,z), Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;   // text on a back face, read from behind
const loc = (pts, dx) => pts.map(([u, v]) => FL(u, v, dx));
const lrr = (u, v, w, h, r = 0, dx = .3) => loc(r > 0 ? rrUV(u, v, u + w, v + h, Math.min(r, w/2, h/2), 4) : rectUV(u, v, u + w, v + h), dx);
const lcirc = (cu, cv, r, dx = .3, n = 14) => loc(ellUV(cu, cv, r, r, n), dx);
const mw = w => `style="stroke-width:${w.toFixed(2)}"`;      // a stroke in model units (not rescaled by inkScale)
const angS = s => (-60 + 60*s) * Math.PI / 180;
const clamp01 = v => Math.max(0, Math.min(1, v));

const tmix = (a, b, k) => mix(a, b, clamp01(k));
// brownness b: 0 raw, 1 golden, BMAX very dark brown (never black, no smoke)
const toastCol = b => b <= 1 ? tmix(RAW, SHADES[1].col, b) : tmix(SHADES[1].col, BURNT, (b - 1) / (BMAX - 1));
const zig = (u0, u1, v, a, n) => { const o = [[u0, v]]; for (let i = 1; i <= n; i++) o.push([u0 + (u1-u0)*i/n, v + (i % 2 ? -a : a) * (i === n ? 0 : 1)]); return o; };
const boxCorners = (x0, y0, z0, x1, y1, z1) => { const o = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) o.push([x, y, z]); return o; };
const hitLine = (id, pts, r) => part(id, `<path d="${pd(pts, false)}" fill="none" stroke="transparent" style="stroke-width:${(2*r*CAM_K).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" pointer-events="stroke"/>`);
const hitDot = (id, p, r) => { const [X, Y] = P(...p); return part(id, `<circle cx="${f(X)}" cy="${f(Y)}" r="${(r*CAM_K).toFixed(2)}" fill="transparent" pointer-events="all"/>`); };

/* ---------- one bread slice standing in a slot: thin along x (x0..x1), a convex profile in (y, z) above the top ---------- */
function hull2(pts){ const h = hull(pts.map(([y, z]) => [y, -z])); return h.map(([y, z]) => [y, -z]); }
// cBack: crumb colour of the face toward -x, cFront: of the face toward +x
function slice(x0, x1, top, cBack, cFront){
  const crumb = mix(cBack, cFront, .5);
  const crust = mix(crumb, '#5a2c0e', .42), crustTop = mix(crumb, '#5a2c0e', .3);
  const arc = (cy, cz, r, a0, a1, n = 6) => Array.from({length:n+1}, (_, i) => { const a = (a0 + (a1-a0)*i/n)*Math.PI/180; return [cy + r*Math.cos(a), cz + r*Math.sin(a)]; });
  const y0 = 27, y1 = 93, sh = 9;
  // up the side, round shoulder, gentle dome ~4 above the shoulders, shoulder, down; kept convex and above the top
  const raw = [[y0, H], ...arc(y0 + sh, top - sh, sh, 180, 90), ...arc((y0+y1)/2, top - 36, 40, 116, 64, 10),
    ...arc(y1 - sh, top - sh, sh, 90, 0), [y1, H]].map(([y, z]) => [y, Math.max(H, z)]);
  const prof = hull2(raw);
  const A = on(PX(x0), prof), B = on(PX(x1), prof), CM = { l:crustTop, m:crust, d:mix(crust, '#000000', .25) };
  let s = loft(A, B, n => toneI(n, CM));
  // the big face toward the viewer: crust rim, crumb inset, a few pores
  const fx = vis([1,0,0]) ? x1 : vis([-1,0,0]) ? x0 : null;
  if (fx != null){
    const o = fx === x1 ? .05 : -.05, face = on(PX(fx), prof), fc = fx === x1 ? cFront : cBack, fcr = mix(fc, '#5a2c0e', .42);
    s += shape(face, fcr, .9);
    const cy = (y0+y1)/2, cz = (H + top)/2 + 4;
    s += fill(pd(prof.map(([y, z]) => [fx + o, cy + (y - cy)*.86, Math.max(H + .6, cz + (z - cz)*.86)])), mix(fc, '#ffffff', .32));
    let pr = '';
    for (const [y, dz] of [[40,6],[52,11],[63,5],[73,9],[47,15],[66,14],[57,3],[80,6]]){ const z = top - 6 - dz;
      if (z > H + 1.5) pr += pd([[fx+2*o,y-.9,z-.6],[fx+2*o,y+.9,z-.6],[fx+2*o,y+.9,z+.6],[fx+2*o,y-.9,z+.6]]); }
    if (pr) s += fill(pr, mix(fc, '#5a2c0e', .22));
  }
  return s + hullInk([...A, ...B], 1.4);
}
// brownness of the two faces of a slice: [back, front]
const sliceFaces = (st, si) => [st.b[si*2], st.b[si*2 + 1]];

/* ---------- the toaster in its own frame (placed on the bench by scene) ---------- */
function toasterLocal(st, m, k){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), LEFT = facing([0,1,0]);
  const front = tone([1,0,0], m);

  // things on the front: the lever knob (follows the carriage) and the dial (fixed at golden)
  const lz = H - (14 + 30*st.pos);
  const lever = act('lever', part('spak', box(W - 1, D - 106, lz - 3, W + 8, D - 93, lz + 3, LEVM, toneI, 1.1)));
  const a = angS(st.shade);
  let dial = cylX(W, W + 3, DY, DZ, DR, KNOBM, toneI, 1.1, 24);
  if (FRONT) dial += ink(pd([[W + 3.05, DY, DZ], [W + 3.05, DY - DR*.8*Math.sin(a), DZ + DR*.8*Math.cos(a)]], false), 1.1);
  const mounted = byDepth([
    { box:[[W - 1, D - 106, lz - 3], [W + 8, D - 93, lz + 3]], svg: lever },
    { box:[[W, DY - DR, DZ - DR], [W + 3, DY + DR, DZ + DR]], svg: part('ratt', dial) } ]);

  // ---- the body ----
  let body = '';
  if (FRONT){
    body += fill(pd(on(PX(W), OUT)), front);
    body += shape(lrr(91, 5, 18, 68, 4), CREAM, .9);
    body += shape(lrr(98.5, 10, 3, 40, 1.5, .33), RECESS, .7);
    body += act('lever', part('spak', fill(pd(lrr(91, 5, 18, 48, 4, .36)), 'transparent')));
    for (const kk of [0, 1, 2]){ const g = angS(kk);
      body += part('ratt', shape(lcirc(100 + 7.4*Math.sin(g), 61 - 7.4*Math.cos(g), 1.3, .34), kk === st.shade ? '#ff8a2e' : '#c9c1b2', .5)); }
  }
  if (BACK){ const tb = tone([-1,0,0], m);
    body += fill(pd(on(PX(0), OUT)), tb);
    body += shape(on(PX(-.2), rrUV(30, 22, 62, 38, 2)), '#f3f0e6', .9);
    body += txB(-.3, 46, 32.4, '230V~ 900W', 2.6, INK, 800) + txB(-.3, 46, 26.6, 'MOD. T2', 2.2, INK, 700); }
  body += extrude(OUT, 0, W, m);
  if (LEFT){
    const sm = tone([0,1,0], m);
    body += shape(on(PY(D + .2), rrUV(15, H - 38, 55, H - 16, 6)), mix(sm, '#ffffff', .22), 1);
    body += txY(35, D + .3, H - 30.5, 'ROSTA', 7, mix(sm, '#000000', .45), 800);
    let v = ''; for (let kk = 50; kk <= 66; kk += 4) v += pd([[18, D + .2, H - kk], [52, D + .2, H - kk]], false);
    body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".7"/>`;
  }
  const glowSlot = [st.heat, st.heat * (st.fWire ? .5 : 1)];
  SLOTS.forEach((x, si) => { const sl = on(PZ(H + .05), rrUV(x, 20, x + 8, 100, 3, 4));
    body += part('slits', shape(sl, RECESS, 1.1) + fill(pd(sl), '#ff6a2a', `opacity="${(glowSlot[si]*.75).toFixed(3)}"`)); });
  if (FRONT) body += ink(pd(on(PX(W), OUT)), 2.2);
  if (BACK) body += ink(pd(on(PX(0), OUT)), 2.2);
  body += hullInk([...on(PX(0), OUT), ...on(PX(W), OUT)], 2.8);

  // bread on top (up = 20 units showing); always above the top face, so it goes after the body
  const bt = H + 3 + 20*(1 - st.pos);
  const bread = byDepth(st.bread ? SLOTS.map((x, si) => { const [cb, cf] = sliceFaces(st, si);
    return { box:[[x + 1.5, 27, H], [x + 6.5, 93, bt]], svg: act('bread', part('brod', slice(x + 1.5, x + 6.5, bt, toastCol(cb), toastCol(cf)))) }; }) : []);

  let hits = '';
  let mech = '';
  if (k > 0){ body = xrGhost(body, '', k, OUT, 0, W, m); mech = `<g opacity="${f(k)}">${toastMech(st, k)}</g>`; }   // inside parts over the ghost
  if (k > .6) hits = xrHits(st);
  // ?split=1 speed test: the same drawing as layers (ghosted case, inside parts, mounted parts, bread), see scene()
  if (PILLA_OPT.split) return FRONT ? [body, mech, mounted, bread + hits] : [mounted, body, mech, bread + hits];
  return (FRONT ? body + mech + mounted : mounted + body + mech) + bread + hits;
}

/* ---------- see-through: how a real pop-up toaster works ----------
   Parts (each held by another; the current and the pop each have a real path):
   HEAT    three mica cards (varmekort) wound with nichrome wire (glodtrad): outer, middle shared by both slots, outer .
           card rails at the top . wire bread guards each side of each slot
   POP     guide rod . carriage block riding it (vagn) with a bread rack under each slot on a crossbar . lever arm (spak) out
           through the front . extension spring (fjader) up to the top bracket . switch contacts the carriage closes at the bottom .
           latch lever (sparr) on its pivot with the hook over the carriage . bimetal strip (bimetall, copper + steel) on its
           bracket by the outer card, whose tip pushes the latch's top . shade link from the dial shaft (ratt) to the strip's bracket
   POWER   cord grommet . terminal block . live wire along the floor to the contacts . bus from the contacts to each card
   BASE    crumb tray (smulbricka) */
const MICA = { l:'#f3ead2', m:'#e2d6b6', d:'#bdb08c' }, TGM = { l:'#7c8389', m:'#5c6369', d:'#3b4146' };
const CARDS = [17, 34, 51], CY0 = 22, CY1 = 98, CZ0 = 14, CZ1 = 74;
const GROD = [60, 16], SX = 56, LP = [24, 50];                     // guide rod (x, y); strip/latch plane; latch pivot (y, z)
const BRK_R = 7.5;                                                 // radius of the scorch mark round the break
const BRK = [50, 70];                                            // the break in CARDS[2]'s fourth wire row: the gap runs y = 56..64
const CRK = 69.5, CHW = 4.5;                                      // the crack in the strip: centre height and half length
const tBoxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - 1), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + 1)];
const tWire = (pts, col, w = .5) => { const d = pd(pts, false), [a, b] = [P(...pts[0]), P(...pts[pts.length - 1])];
  return { box: tBoxOf(pts), svg: part('sladd', `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1)}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linejoin="round" stroke-linecap="round"/>`
    + [a, b].map(([X, Y]) => `<circle cx="${f(X)}" cy="${f(Y)}" r="1.2" fill="${INK}"/>`).join('')) }; };
const rbCoil = (xc, y, zA, zB, amp, seg) => { const n = Math.max(2, Math.round(Math.abs(zB - zA) / seg)), o = [];
  for (let i = 0; i <= n; i++) o.push([xc + (i && i < n ? (i % 2 ? amp : -amp) : 0), y, zA + (zB - zA)*i/n]); return o; };
const rbWire = (pts, core = '#cfd6d8') => `<path d="${pd(pts, false)}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="${pd(pts, false)}" fill="none" stroke="${core}" stroke-width=".7" stroke-linejoin="round" stroke-linecap="round"/>`;
let MECH_ITEMS = [];
const carriageZ = st => H - (14 + 30*st.pos);
const contactsClosed = st => (st.mode === 'hold' || (st.mode === 'release' && st.latch < .5)) && st.pos > .9;
const repU = (st, id) => st.rep && st.rep.id === id ? st.rep.u : -1;

// invisible tap targets over the see-through insides, so a finger on a thin part is never caught by the ghost shell
function xrHits(st){
  const lz = carriageZ(st), sx = GROD[0], sy = GROD[1] + 2.4;
  let s = '';
  for (const xc of CARDS) for (let z = CZ0 + 6; z <= CZ1 - 6; z += 8) s += hitLine('glodtrad', [[xc, CY0 + 2, z], [xc, CY1 - 2, z]], 2.2);
  s += hitLine('fjader', [[sx, sy, lz + 4], [sx, sy, CZ1 + 2]], 2.6)
    + hitLine('bimetall', [[SX, 33, 74], [SX, 31, 62]], 2.6)
    + hitDot('sparr', [SX, 21, 50], 5)
    + hitDot('vagn', [SX + 4, 16, lz], 5)
    + hitLine('vagn', [[SLOTS[0] + 1, 30, lz - 25], [SLOTS[1] + 7, 30, lz - 25]], 1.8)
    + hitLine('spak', [[64, 18, lz], [W, 18, lz]], 2.6);
  return s;
}

function toastMech(st, k){
  const h = st.heat, parts = [], put = (b, svg) => parts.push({ box: b, svg }), down = st.pos;
  const bx = (x0, y0, z0, x1, y1, z1, m, w = .8, id = '') => put([[x0, y0, z0], [x1, y1, z1]], (id ? part(id, box(x0, y0, z0, x1, y1, z1, m, toneI, w)) : box(x0, y0, z0, x1, y1, z1, m, toneI, w)));
  const lz = carriageZ(st), rack = lz - 25;                          // carriage height (same as the lever outside), bread rack
  const closed = contactsClosed(st);
  const hot = c => h > .05 ? mix('#7d7169', c, h) : '#7d7169';
  const rw = repU(st, 'trasig-glodtrad'), rs = repU(st, 'trasig-fjader'), rb = repU(st, 'sprucken-bimetall');
  // ---- heating: three mica cards with nichrome zigzags, held by two rails at the top
  CARDS.forEach((xc, ci) => {
    const dead = ci === 2 && st.fWire;                                // broken wire: no current, so it stays grey and never glows
    let c = part('varmekort', shape(on(PX(xc), rectUV(CY0, CZ0, CY1, CZ1)), MICA.m, .8)), wd = '';
    const lerpEnd = dead && rw >= 0 ? clamp01(rw/.25) : 0;           // the loose ends straighten back during a repair
    if (dead){      // a scorched smudge on the card where the wire gave way, so the break reads at a glance
      const [SX0, SY0] = P(xc + .2, (BRK[0] + BRK[1])/2, CZ0 + 6 + 8*3), so = rw >= 0 ? 1 - clamp01(rw/.6) : 1;
